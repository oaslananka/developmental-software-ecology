name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install locked CI dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          --requirement requirements-ci.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  gvisor-runtime-probe:
    runs-on: ubuntu-latest
    env:
      DSE_GVISOR_INTEGRATION: "1"
      DSE_SECRET_CANARY: "host-only-ci-canary"
      DSE_GVISOR_PROBE_IMAGE: "python:3.12-slim"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install probe test dependency
        run: >-
          python -m pip install --only-binary=:all: pytest==8.4.2
      - name: Install gVisor runsc
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' \
            https://gvisor.dev/archive.key |
            sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" |
            sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo systemctl restart docker
          if ! docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'; then
            sudo runsc install
            sudo systemctl restart docker
          fi
          runsc --version
          sha256sum "$(command -v runsc)"
          docker info --format '{{json .Runtimes}}'
      - name: Pull qualification image
        run: docker pull "$DSE_GVISOR_PROBE_IMAGE"
      - name: Run measured gVisor probes
        run: pytest -q tests/test_gvisor_runtime_integration.py

