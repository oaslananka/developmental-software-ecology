schema_version: "0.1"
evaluation_profile: "v0_1-hidden-functional-suite"
functional_opportunity_profile: "v0_1-functional-submission"

study:
  enforce_condition_contract: true
  text_culture: "none"
  artifact_culture: "none"
  social_channel: "isolated"
  ril_control: true
  compute_match_group: "v0_1-primary-compute"
  ril_topology: "independent_isolated"

experiment:
  id: "v0_1-condition-ril-seed-42"
  name: "V0.1 Repeated Individual Learning Control"
  condition: "RIL"
  seed: 42

world:
  agent_count: 5
  max_world_ticks: 1000
  tick_duration_sim_seconds: 60
  snapshot_interval_ticks: 100

agents:
  initial_traits:
    exploration_bias: 0.5
    persistence: 0.5
    social_bias: 0.5
    risk_bias: 0.5
  lifecycle:
    active_ticks_per_cycle: 400
    sleep_ticks_per_cycle: 100
  turnover:
    enabled: true
    ticks: [150]
    agent_ids:
      - "agent-0001"
      - "agent-0002"
      - "agent-0003"
      - "agent-0004"
      - "agent-0005"
  cognition:
    enabled: true
    model_calls_per_cycle: 7
    interval_ticks: 20
  goals:
    enabled: true
    lifecycle_enabled: true
    max_active_goals: 1
  actions:
    enabled: true
    proposals_per_cycle: 5
  tool_broker:
    enabled: false
    executions_per_cycle: 0
    executor: "deterministic-fake"
  memory:
    enabled: true
    capacity: 32
    retrieval_limit: 4
  sleep_memory:
    enabled: false
    strengthen_top_k: 0
    salience_boost: 0.0
    forget_below_salience: 0.0
    forget_older_than_ticks: 0
    max_forget_per_sleep: 0

runtime:
  llm_enabled: true
  forge_enabled: false
  sandbox_enabled: false
  web_enabled: false
  text_culture:
    enabled: false
    operations_per_cycle: 4
    max_entries: 512
    max_entry_bytes: 4096
    context_entry_limit: 16
    context_content_chars: 1024
  social:
    enabled: false
    mode: "none"
    operations_per_cycle: 4
    max_messages: 1024
    max_threads: 256
    max_message_bytes: 2048
    context_message_limit: 16
    context_content_chars: 512
  forge:
    enabled: false
    provider: "deterministic-memory"
    default_branch: "main"
    max_artifact_bytes: 16384
    max_repositories: 32
    max_artifacts_per_repository: 256
    operations_per_cycle: 4
    inspection_artifact_limit: 8
    inspection_content_chars: 1024
  model_provider:
    kind: "fake"
    model: "fake-cognition-v0.1"
