schema_version: "0.1"

experiment:
  id: "m3.1-sleep-memory-consolidation-fake-seed-42"
  name: "M3.1 Sleep Memory Consolidation Fake Provider"
  condition: "ES"
  seed: 42

world:
  agent_count: 5
  max_world_ticks: 10000
  tick_duration_sim_seconds: 60
  snapshot_interval_ticks: 1000

agents:
  initial_traits:
    exploration_bias: 0.5
    persistence: 0.5
    social_bias: 0.5
    risk_bias: 0.5
  lifecycle:
    active_ticks_per_cycle: 960
    sleep_ticks_per_cycle: 480
  cognition:
    enabled: true
    model_calls_per_cycle: 4
    interval_ticks: 200
  memory:
    enabled: true
    capacity: 3
    retrieval_limit: 2
  sleep_memory:
    enabled: true
    strengthen_top_k: 2
    salience_boost: 0.1
    forget_below_salience: 0.8
    forget_older_than_ticks: 500
    max_forget_per_sleep: 1

runtime:
  llm_enabled: true
  forge_enabled: false
  sandbox_enabled: false
  web_enabled: false
  model_provider:
    kind: "fake"
    model: "fake-cognition-v0.1"
